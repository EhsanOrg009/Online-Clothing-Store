# =====================================================================
#  api.minikandoo.ir
#
#  در این پروژه، API یک اپ جداگانه نیست؛ همین Django (SSR) هم سایت را
#  سرو می‌کند و هم مسیرهای API را (در آینده DRF/Ninja اضافه می‌شود).
#  nginx این ساب‌دامین را به همان upstream می‌فرستد تا:
#     • CORS و دامنه‌ی کوکی‌ها از هم جدا بمانند،
#     • محدودیت نرخ و لاگ‌های API مستقل باشد،
#     • مهاجرت آینده به سرویس مستقل فقط تغییر upstream باشد.
#
#  ⚠️ CSRF: کوکی CSRF برای API باید روی دامنه‌ی اپ باشد. فرم‌های سایت
#     روی minikandoo.ir هستند و به API از همان origin درخواست نمی‌زنند؛
#     درخواست‌های Cross-origin به API باید با توکن‌های Bearer/امضا
#     انجام شوند، نه کوکی مرورگر.
# =====================================================================

# ---------------------------------------------------------------------
#  HTTP — ACME + redirect
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.minikandoo.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
#  HTTPS — API
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.minikandoo.ir;

    # Bootstrap issues one SAN certificate whose primary name is minikandoo.ir.
    ssl_certificate     /etc/letsencrypt/live/minikandoo.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minikandoo.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/minikandoo.ir/chain.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # پاسخ‌ها JSON هستند؛ فشرده‌سازی به nginx سراسری سپرده شده است.
    client_max_body_size 10m;

    # static/API ندارد؛ هر مسیری به Django می‌رود.
    location / {
        limit_req zone=shop_general burst=30 nodelay;

        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect off;
    }
}
