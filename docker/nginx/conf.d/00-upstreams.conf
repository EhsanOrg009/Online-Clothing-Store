# Shared Django/Gunicorn upstream. The shop and API host currently use the
# same Django container; config.api_urls is a restricted host-specific URLconf.
upstream django_app {
    server web:8000;
    keepalive 32;
}

# Any unrecognized Host is rejected rather than reaching the storefront.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}
