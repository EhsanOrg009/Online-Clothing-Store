# =====================================================================
#  دامنه‌ی اصلی — minikandoo.ir و www.minikandoo.ir
#
#  ساختار:
#    • HTTP (80)  → redirect به HTTPS
#    • HTTPS (443) → Django/Gunicorn (upstream django_app)
#    • /static/ و /media/ مستقیماً از Volume سرو می‌شوند (بدون عبور از Django)
#    • /admin/     → همان Django (پنل مدیریت روی دامنه‌ی اصلی)
#    • /.well-known/acme-challenge/ → webroot برای صدور/تمدید گواهی Let's Encrypt
#
#  گواهی با certbot (سرویس `certbot` در docker-compose) ساخته می‌شود:
#      docker compose -f docker-compose.yml run --rm certbot certonly ...
#  تا زمانی که گواهی ساخته نشده، بلوک HTTPS خطا می‌دهد؛ برای راه‌اندازی
#  اولیه از فایل `docker/nginx/conf.d/bootstrap.conf` (اگر موجود باشد)
#  یا مستقیم از مسیر HTTP استفاده کنید.
# =====================================================================

# ---------------------------------------------------------------------
#  HTTP — تمدید ACME + redirect دائمی به HTTPS
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name minikandoo.ir www.minikandoo.ir;
    location = /nginx-health { access_log off; return 204; }

    # certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
#  HTTPS — سایت اصلی
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minikandoo.ir www.minikandoo.ir;

    ssl_certificate     /etc/letsencrypt/live/minikandoo.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minikandoo.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/minikandoo.ir/chain.pem;

    # هدرهای امنیتی مکمل (Django هم خودش HSTS و CSP می‌فرستد؛ اینجا
    # فقط مواردی که سمت nginx بهتر جواب می‌دهند تنظیم شده‌اند).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # -----------------------------------------------------------------
    #  static و media
    #  مسیرها به Volumeهای docker-compose اشاره می‌کنند (read-only).
    #  `collectstatic` فایل‌ها را در /app/staticfiles می‌گذارد.
    # -----------------------------------------------------------------
    location /static/ {
        alias /srv/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # فایل‌های hashed شده توسط WhiteNoise؛ immutable امن است.
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # جلوگیری از اجرای فایل‌های آپلودی به‌عنوان HTML/SVG در همین origin
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # -----------------------------------------------------------------
    #  مسیرهای حساس: محدودیت نرخ سخت‌گیرانه‌تر
    # -----------------------------------------------------------------
    location ~ ^/(accounts/(login|verify|resend)|admin/login)/ {
        limit_req zone=shop_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # -----------------------------------------------------------------
    #  بقیه‌ی درخواست‌ها → Django
    # -----------------------------------------------------------------
    location / {
        limit_req zone=shop_general burst=40 nodelay;

        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect off;
    }
}
