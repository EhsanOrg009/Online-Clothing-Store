# Temporary HTTP-only virtual hosts for first certificate issuance.
# Mount this directory instead of conf.d until certificates exist.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name minikandoo.ir www.minikandoo.ir api.minikandoo.ir;
    location = /nginx-health { access_log off; return 204; }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 200 "ACME bootstrap is ready\n"; add_header Content-Type text/plain; }
}
