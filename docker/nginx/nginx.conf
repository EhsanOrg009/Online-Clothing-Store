# =====================================================================
#  nginx — پیکربندی سراسری
#
#  این فایل به /etc/nginx/nginx.conf کانتینر nginx مونت می‌شود.
#  کانفیگ دامنه‌ها در conf.d/ است:
#      conf.d/minikandoo.conf   → minikandoo.ir و www.minikandoo.ir
#      conf.d/api.conf          → api.minikandoo.ir
#  هر دو فایل از upstream مشترک `django_app` در conf.d/upstreams.conf
#  استفاده می‌کنند.
# =====================================================================

user  nginx;
worker_processes  auto;

# در کانتینر، لاگ‌ها به stdout/stderr می‌روند تا `docker compose logs nginx` کار کند
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # لاگ استاندارد دسترسی (زمان پاسخ و upstream را هم ثبت می‌کند)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # حداکثر حجم بدنه: آپلود تصاویر محصول و فیش‌ها
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # هدرهای پراکسی
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # فشرده‌سازی (HTML/CSS/JS/Font). فایل‌های از پیش فشرده‌شده WhiteNoise
    # (gzip_static) در صورت وجود ترجیح داده می‌شوند.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/ttf font/otf
        application/vnd.ms-fontobject;

    # دانلود فونت‌های woff2 قبلاً فشرده‌اند؛ دوباره gzip نکن
    gzip_disable "msie6";

    # TLS (مقدارهای امن و سازگار با Let's Encrypt)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # محدودیت نرخ درخواست (لایه‌ی مکمل Rate Limit داخلی Django)
    # مقادیر عمداً سخاوتمندانه‌اند؛ OTP و لاگین در خود Django دقیق‌تر محدود می‌شوند.
    limit_req_zone $binary_remote_addr zone=shop_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=shop_auth:10m rate=3r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
