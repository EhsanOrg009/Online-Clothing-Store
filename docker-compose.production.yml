# Use scripts/compose-production; never merge the development override here.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    ports: !reset []
    environment:
      DEBUG: "False"
      DATABASE_ENGINE: mysql
      SITE_URL: ${SITE_URL:-https://minikandoo.ir}
      API_URL: ${API_URL:-https://api.minikandoo.ir}
      ALLOWED_HOSTS: minikandoo.ir,www.minikandoo.ir,api.minikandoo.ir,localhost
      CSRF_TRUSTED_ORIGINS: https://minikandoo.ir,https://www.minikandoo.ir
      TRUSTED_PROXY_IPS: ${NGINX_PROXY_IP:-172.30.50.2}
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      REDIS_URL: redis://redis:6379/0
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-60}
      SHIPPING_FEE: ${SHIPPING_FEE:-50000}
      FREE_SHIPPING_MIN_AMOUNT: ${FREE_SHIPPING_MIN_AMOUNT:-2000000}
      SHIPPING_METHOD_NAME: ${SHIPPING_METHOD_NAME:-ارسال پست پیشتاز}
      MAX_QUANTITY_PER_ITEM: ${MAX_QUANTITY_PER_ITEM:-10}
      ORDER_RESERVATION_MINUTES: ${ORDER_RESERVATION_MINUTES:-30}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-2592000}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_SECRET: ${SMS_API_SECRET:-}
      SMS_SENDER: ${SMS_SENDER:-}
      OTP_LENGTH: ${OTP_LENGTH:-5}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-180}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-90}
      OTP_RESEND_LIMIT_PER_HOUR: ${OTP_RESEND_LIMIT_PER_HOUR:-5}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      LOG_TO_FILE: "False"
      MIGRATE_ON_START: "0"
      COLLECTSTATIC_ON_START: "1"
      SEED_ON_START: "0"
      WAIT_TIMEOUT: "180"
      ZIBAL_PAID_AT_TIMEZONE: ${ZIBAL_PAID_AT_TIMEZONE:-}
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    networks:
      shop-net: {}
      proxy-net: {}
    logging: *logs

  db:
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set an independent database root password}
    logging: *logs

  db-backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    # Existing private host backups are owned by root. No recursive chown or
    # changes to their permissions are performed; all capabilities are dropped.
    user: "${BACKUP_UID:-0}:${BACKUP_GID:-0}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      # Mask the official image's inherited data VOLUME. The worker uses TCP
      # clients only; no anonymous database-data volume is needed or created.
      - /var/lib/mysql:ro,noexec,nosuid,nodev
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME:-clothing_shop}
      # Reuse the existing dump account. Root can export routines/events and
      # acquire consistency locks; no new accounts or production grants are made.
      DATABASE_USER: root
      DATABASE_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set an independent database root password}
      BACKUP_DIRECTORY: /backups
      BACKUP_RETENTION_RECENT: ${BACKUP_RETENTION_RECENT:-48}
      BACKUP_RETENTION_DAILY_DAYS: ${BACKUP_RETENTION_DAILY_DAYS:-7}
      # Review the initial dry-run before opting into managed-file deletions.
      BACKUP_RETENTION_MODE: ${BACKUP_RETENTION_MODE:-dry-run}
      BACKUP_MAX_TOTAL_BYTES: ${BACKUP_MAX_TOTAL_BYTES:-}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-}
      BACKUP_NON_TRANSACTIONAL_POLICY: ${BACKUP_NON_TRANSACTIONAL_POLICY:-refuse}
      BACKUP_COMMAND_TIMEOUT_SECONDS: ${BACKUP_COMMAND_TIMEOUT_SECONDS:-1200}
    volumes:
      - type: bind
        source: ${BACKUP_HOST_DIR:-/root/minikandoo-backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks: [shop-net]
    healthcheck:
      test: [CMD, python3, /opt/minikandoo/db_backup.py, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logs

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Rate-limit state survives service recreation; never evict active counters.
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    networks: [shop-net]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logs

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/srv/staticfiles:ro
      - media-data:/srv/media:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      proxy-net:
        ipv4_address: ${NGINX_PROXY_IP:-172.30.50.2}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: minikandoo.ir", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logs

  certbot:
    image: certbot/certbot:v5.0.0
    profiles: [certificates]
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [proxy-net]
    logging: *logs

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.50.0/24}
  shop-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.51.0/24}

volumes:
  redis-data:
  staticfiles:
  certbot-webroot:
  letsencrypt:
