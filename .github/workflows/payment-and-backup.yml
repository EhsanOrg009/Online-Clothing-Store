name: Payment and database backup checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install declared build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config default-libmysqlclient-dev
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.23
          uv sync --frozen --extra production
      - name: Full isolated SQLite suite and migration consistency
        env:
          PYTHONPATH: scripts/qa
        run: |
          .venv/bin/python manage.py test --settings=shop_test_settings --noinput
          .venv/bin/python manage.py makemigrations --check --dry-run --settings=shop_test_settings
          .venv/bin/python manage.py check --settings=shop_test_settings
          sh -n scripts/compose-production scripts/backup-production-db
          git diff --check

  mariadb-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install declared build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config default-libmysqlclient-dev
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.23
          uv sync --frozen --extra production
      - name: Full MariaDB suite, backup image and isolated restore
        run: .venv/bin/python scripts/qa/test_backup_stack.py
      # Private fixtures and SQL backups stay on the runner. They are never
      # uploaded as artifacts or sent to an external storage service.
