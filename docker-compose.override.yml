# =====================================================================
#  پیکربندی توسعه — به‌طور خودکار با `docker compose` خوانده می‌شود
#
#  تفاوت با نسخه اصلی:
#    • کد به‌صورت Volume مونت می‌شود → Hot-Reload
#    • به‌جای Gunicorn از `runserver` استفاده می‌شود
#    • DEBUG=True و پنل phpMyAdmin فعال است
#    • Migration در هر بار بالا آمدن اجرا می‌شود (MIGRATE_ON_START=1)
#
#  اجرا:
#      docker compose up -d --build
#      docker compose exec web python manage.py seed_demo_data
# =====================================================================

services:
  db:
    ports:
      # دسترسی مستقیم از میزبان (برای ابزارهایی مانند DBeaver)
      #
      # ⚠️ پیش‌فرض عمداً 3307 است و نه 3306.
      #    اگر MariaDB/XAMPP محلی روی 3306 اجرا باشد، انتشار همان پورت باعث
      #    شکست `docker compose up` با خطای «port is already allocated»
      #    می‌شود. برای تغییر پورت میزبان:
      #        DB_PORT=3309 docker compose up -d
      - "${DB_PORT:-3307}:3306"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      # در توسعه، Secret پیش‌فرض را قبول می‌کنیم
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production-9f2b7c1d4e5a6f708192a3b4c5d6e7f8}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-dev-payment-secret-0123456789abcdef}
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      # بدون این، Migration هنگام هر بار بالا آمدن اجرا می‌شود
      MIGRATE_ON_START: ${MIGRATE_ON_START:-1}
      COLLECTSTATIC_ON_START: "0"
      WAIT_TIMEOUT: "180"
    volumes:
      # کد به‌صورت زنده مونت می‌شود تا تغییرات بلافاصله اعمال شود
      - .:/app
      # از ایمیج، فقط وابستگی‌های ساخته‌شده را نگه می‌داریم
      - /app/.venv
      - /app/node_modules
      - /app/staticfiles
      - media-data:/app/media

  phpmyadmin:
    profiles: ["tools"]
